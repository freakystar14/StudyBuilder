<head>

<meta name="viewport" content="width=device-width, initial-scale=1.0">

<style>
body{
font-family:-apple-system,BlinkMacSystemFont,sans-serif;
background:#f7f7f5;
margin:0;
padding:20px;
color:#222;
}

.container{
max-width:1000px;
margin:auto;
}

h1{
text-align:center;
margin-bottom:10px;
}

.subtitle{

color:#666;
margin-bottom:30px;
}

.video{

padding-bottom:56.25%;
height:0;
overflow:hidden;
border-radius:15px;
}

.video iframe{
position:absolute;
top:0;
left:0;
width:100%;
height:100%;
border:0;
}

.back{
display:inline-block;
margin-top:25px;
text-decoration:none;
padding:12px 20px;
background:#222;
color:white;
border-radius:10px;
}

.info{
margin-top:25px;
background:white;
padding:20px;
border-radius:15px;
}
.menu-button{
position:fixed;
top:20px;
left:20px;
font-size:28px;
cursor:pointer;
z-index:1000;
}

.sidebar{
position:fixed;
top:0;
left:-250px;
width:220px;
height:100%;
background:white;
padding-top:80px;
box-shadow:2px 0 10px rgba(0,0,0,0.1);
transition:0.3s;
z-index:999;
}

.sidebar a{
display:block;
padding:15px 25px;
text-decoration:none;
color:#222;
font-weight:500;
}

.sidebar.active{
left:0;
}

.logo{
font-size:24px;
font-weight:700;
padding:20px 25px;
margin-bottom:20px;
}
.timer-box{
background:white;
padding:20px;
border-radius:15px;
margin-bottom:30px;
text-align:center;
}

#timer{
font-size:40px;
font-weight:700;
margin:20px 0;
}

.timer-buttons button{
padding:10px 18px;
margin:5px;
border:none;
border-radius:8px;
cursor:pointer;
font-size:16px;
}
</style>
</head>

<body>

<div class="menu-button" onclick="toggleMenu()">
☰
</div>

<div id="sidebar" class="sidebar">

<div class="logo">
🏗️ StudyBuilder
</div>

<a href="index.html">Home</a>
<a href="builds.html">Build Library</a>
<a href="about.html">About</a>
<a href="feedback.html">Feedback</a>

</div>

<div class="container">

<h1>🌉 Bridge Construction</h1>

<p class="subtitle">
30 Minute Focus Session
</p>
<div class="timer-box">

<h2>Focus Session</h2>

<div id="timer">00:00:00</div>

<div class="timer-buttons">
<button onclick="startTimer()">Start</button>
<button onclick="pauseTimer()">Pause</button>
<button onclick="resetTimer()">Reset</button>
</div>

</div>

<div class="video">
<iframe
src="https://www.youtube.com/embed/Hmpp29XM0KY"
allowfullscreen>
</iframe>
</div>

<div class="info">
<h3>About this build</h3>
<p>
Watch a bridge gradually take shape while you study, read, work, or focus.
No music. No distractions. Just progress.
</p>
</div>

<a href="builds.html" class="back">
← Back to Build Library
</a>

</div>

<script>
function toggleMenu(){
document.getElementById("sidebar").classList.toggle("active");
}
</script>
<script>

let seconds = 0;
let timerInterval = null;

function updateTimer(){

let hrs = Math.floor(seconds / 3600);
let mins = Math.floor((seconds % 3600) / 60);
let secs = seconds % 60;

document.getElementById("timer").innerText =
String(hrs).padStart(2,'0') + ":" +
String(mins).padStart(2,'0') + ":" +
String(secs).padStart(2,'0');

}

function startTimer(){

if(timerInterval) return;

timerInterval = setInterval(() => {

seconds++;

updateTimer();

},1000);

}

function pauseTimer(){

clearInterval(timerInterval);

timerInterval = null;

}

function resetTimer(){

clearInterval(timerInterval);

timerInterval = null;

seconds = 0;

updateTimer();

}

updateTimer();

</script>
</body>
</html>
